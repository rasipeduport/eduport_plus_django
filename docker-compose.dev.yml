# Eduport DEV -- Dokploy Compose stack (branch: dev).
#
# Services:
#   - redis
#   - backend (gunicorn)
#   - worker (Celery)
#   - beat (Celery Beat)
#
# PostgreSQL is managed separately by Dokploy.
# DB connection details are supplied through Dokploy Environment.
#
# Local docker-compose.yml is not used for this deployment.
# Hub and Learn are separate frontend applications.
#
# Dokploy:
#   - Domains -> backend -> port 8000 -> HTTPS enabled.
#   - Enable Isolated Deployments.
#   - Leave Randomize disabled -- it renames the `default` network that every
#     service below relies on.
#
# IMPORTANT:
#   The external PostgreSQL service (eduport-plus-dev-db) must be on
#   dokploy-network, where Dokploy puts databases unless their network
#   settings detach it. DB_HOST is the Internal Host shown under the
#   database's Internal Credentials. Verify both in Dokploy before deploying.

x-django-env: &django-env
  DEBUG: "False"

  SECRET_KEY: ${SECRET_KEY:?DEV-only Django secret required}

  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?comma-separated hostnames including localhost}

  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?DEV Hub and Learn HTTPS origins required}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?DEV Hub and Learn HTTPS origins required}

  HUB_URL: ${HUB_URL:?DEV Hub URL required}
  LEARN_URL: ${LEARN_URL:?DEV Learn URL required}

  LEARN_INVITATION_KEYS: ${LEARN_INVITATION_KEYS:?DEV-only Fernet key required}

  MARKETING_SITE_URL: ${MARKETING_SITE_URL:?non-production marketing URL required}

  # External Dokploy PostgreSQL. Compose cannot depend on it, so the wait is
  # entrypoint.sh's: up to 60s for DB_HOST:DB_PORT before migrating, else the
  # backend exits and is restarted, and worker and beat keep waiting.
  DB_HOST: ${DB_HOST:?Dokploy PostgreSQL internal hostname required}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME:?DEV database name required}
  DB_USER: ${DB_USER:?DEV database user required}
  DB_PASSWORD: ${DB_PASSWORD:?DEV database password required}

  # Internal Redis
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?DEV Redis password required}@eduplus-dev-redis:6379/0

  MEDIA_ROOT: /app/media

  # HTTPS / proxy security
  SESSION_COOKIE_SECURE: "True"
  CSRF_COOKIE_SECURE: "True"
  TRUST_PROXY_SSL_HEADER: "True"
  SECURE_HSTS_SECONDS: "0"
  NUM_PROXIES: ${NUM_PROXIES:-1}

  # Stripe TEST mode only. Keys come from the STRIPE_TEST_* names, so a pasted
  # STRIPE_SECRET_KEY is overwritten here; a live key is refused in test mode.
  STRIPE_LIVE_MODE: "False"
  STRIPE_SECRET_KEY: ${STRIPE_TEST_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_TEST_WEBHOOK_SECRET:-}
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_TEST_PUBLISHABLE_KEY:-}

  # Disable real email sending
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""

  # Disable real WhatsApp sending
  COMMUNICATIONS_SENDING_ENABLED: "False"
  COMMUNICATIONS_ALLOW_ALL_RECIPIENTS: "False"

  QUOTA_SYNC_CRON_HOUR: ${QUOTA_SYNC_CRON_HOUR:-3}


# Common application configuration
x-backend: &backend
  build:
    context: ./backend

  env_file:
    - .env

  environment: *django-env

  # `default` stays explicit: Isolated mode only appends Dokploy's own network,
  # and a service with no list would lose `default` (and eduplus-dev-redis).
  # dokploy-network is here only to reach the database; Isolated mode never
  # adds it, and Traefik still routes over the isolated network.
  networks:
    - default
    - dokploy-network

  restart: unless-stopped


services:

  # Redis -- internal Celery broker
  redis:
    image: redis:7-alpine

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?DEV Redis password required}

    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?DEV Redis password required}

    volumes:
      - redis_dev:/data

    networks:
      default:
        aliases:
          - eduplus-dev-redis

    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped


  # Django Backend
  backend:
    <<: *backend

    command:
      - gunicorn
      - config.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=${GUNICORN_WORKERS:-2}
      - --timeout=300
      - --access-logfile=-
      - --forwarded-allow-ips=*

    expose:
      - "8000"

    volumes:
      - media_dev:/app/media

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/admin/login/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    # Routing is owned by Dokploy's Domains UI. Do not add Traefik labels
    # here -- two sources would define the same router twice.


  # Celery Worker
  worker:
    <<: *backend

    entrypoint: []

    command:
      - celery
      - -A
      - config
      - worker
      - --loglevel=info
      - --concurrency=${CELERY_CONCURRENCY:-2}

    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy


  # Celery Beat -- exactly one instance
  beat:
    <<: *backend

    entrypoint: []

    command:
      - celery
      - -A
      - config
      - beat
      - --loglevel=info
      - --schedule
      - /tmp/celerybeat-schedule

    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy


# Networks
networks:
  default:

  # Dokploy's shared overlay network (created attachable), used only to reach
  # the standalone PostgreSQL service. Confirm the database is on it first.
  dokploy-network:
    external: true
    name: dokploy-network


# Persistent application data
volumes:
  media_dev:
  redis_dev:
