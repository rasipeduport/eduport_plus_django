# Eduport DEV -- Dokploy Compose stack (branch: dev).
# Services: db, redis, backend (gunicorn), worker, beat.
#
# docker-compose.yml is the local developer stack and is not used here.
# Hub and Learn are separate Dokploy applications.
# WhiteNoise serves static files and uploads go through an authenticated view,
# so no reverse proxy belongs in this stack.
#
# Environment comes from Dokploy's UI. `environment:` is explicit, so a
# variable only reaches the containers if it is listed below.
# See backend/.env.dev.example.

x-django-env: &django-env
  DEBUG: "False"
  SECRET_KEY: ${SECRET_KEY:?DEV-only key, 50+ chars, must not be the production key}
  # Must include `localhost` for the backend healthcheck: under DEBUG=False any
  # other Host is a 400, which would leave worker and beat waiting forever for
  # a healthy backend.
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?comma-separated hostnames, must include localhost}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

  # Pinned rather than variables: entrypoint.sh migrates on every boot, so this
  # stack must have no way to reach the production database.
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-eduplus_dev}
  DB_USER: ${DB_USER:-eduplus}
  DB_PASSWORD: ${DB_PASSWORD:?set a DEV database password}

  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?https origins of the DEV Hub and Learn}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?https origins of the DEV Hub and Learn}
  SESSION_COOKIE_SECURE: "True"
  CSRF_COOKIE_SECURE: "True"
  # SESSION_COOKIE_DOMAIN is intentionally unset: a parent domain shared with
  # production would make the two environments' session cookies collide.

  TRUST_PROXY_SSL_HEADER: "True"   # Traefik sets X-Forwarded-Proto itself
  SECURE_SSL_REDIRECT: "False"     # Traefik already redirects
  SECURE_HSTS_SECONDS: "0"         # never HSTS a development hostname

  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  # Point at a copy of the enrolment sheet, never the production one.
  GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID:-}
  GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}
  GOOGLE_PRIVATE_KEY: ${GOOGLE_PRIVATE_KEY:-}

  CELERY_BROKER_URL: redis://redis:6379/0
  QUOTA_SYNC_CRON_MINUTE: ${QUOTA_SYNC_CRON_MINUTE:-20}
  QUOTA_SYNC_CRON_HOUR: ${QUOTA_SYNC_CRON_HOUR:-3}   # daily on DEV; "*" for hourly

  # Blank selects Django's console backend, so DEV logs invitation emails
  # instead of sending them to real students.
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}

  HUB_URL: ${HUB_URL:?https URL of the DEV Hub}
  LEARN_URL: ${LEARN_URL:?https URL of the DEV Learn}
  MEDIA_ROOT: /app/media

# No source bind mount: the image already contains the code, and mounting the
# repo over /app would hide /app/staticfiles and break its uid-1000 ownership.
x-backend: &backend
  build:
    context: ./backend
  environment: *django-env
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-eduplus_dev}
      POSTGRES_USER: ${DB_USER:-eduplus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set a DEV database password}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eduplus} -d ${DB_NAME:-eduplus_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Celery broker only. Off dokploy-network, so it needs no password.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    <<: *backend
    # Replaces only the image's gunicorn line; its entrypoint (check, wait for
    # Postgres, migrate, collectstatic) still runs. --forwarded-allow-ips is
    # needed because Traefik is not 127.0.0.1.
    command:
      - gunicorn
      - config.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=${GUNICORN_WORKERS:-2}
      - --timeout=300
      - --access-logfile=-
      - --forwarded-allow-ips=*
    expose:
      - "8000"
    volumes:
      - media_dev:/app/media
    networks:
      - default
      - dokploy-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/admin/login/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    labels:
      # Remove this block if the domain is attached from Dokploy's Domains UI.
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.services.eduport-dev-api.loadbalancer.server.port=8000
      - traefik.http.routers.eduport-dev-api.rule=Host(`${API_DOMAIN:?public hostname for the DEV API}`)
      - traefik.http.routers.eduport-dev-api.entrypoints=websecure
      - traefik.http.routers.eduport-dev-api.tls=true
      - traefik.http.routers.eduport-dev-api.tls.certresolver=letsencrypt
      - traefik.http.routers.eduport-dev-api-web.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.eduport-dev-api-web.entrypoints=web
      - traefik.http.routers.eduport-dev-api-web.middlewares=eduport-dev-api-https
      - traefik.http.middlewares.eduport-dev-api-https.redirectscheme.scheme=https

  # entrypoint: [] -- migrations and collectstatic are the backend's job alone.
  worker:
    <<: *backend
    entrypoint: []
    command:
      - celery
      - -A
      - config
      - worker
      - --loglevel=info
      - --concurrency=${CELERY_CONCURRENCY:-2}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  # Exactly one beat -- a second would double every quota sync. Do not scale.
  beat:
    <<: *backend
    entrypoint: []
    command:
      - celery
      - -A
      - config
      - beat
      - --loglevel=info
      - --schedule
      - /tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

networks:
  dokploy-network:
    external: true

volumes:
  pgdata_dev:
  media_dev:
  redis_dev:
