services:
  db:
    image: postgres:16-alpine
    container_name: eduplus-db
    environment:
      POSTGRES_DB: ${DB_NAME:-eduplus}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposed so you can point a local psql / GUI client at it.
      - "${DB_PORT_HOST:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-eduplus}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: eduplus-backend
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DB_NAME: ${DB_NAME:-eduplus}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # 'db' is the compose service name, not localhost.
      DB_HOST: db
      DB_PORT: 5432
      TIME_ZONE: ${TIME_ZONE:-Asia/Kolkata}
      ALLOW_MOCK_AUTH: ${ALLOW_MOCK_AUTH:-False}
      # Session auth is cookie-based, so these origins must match the browser
      # URLs of hub/learn exactly (scheme + host + port) or login will fail.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID:-}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_PRIVATE_KEY: ${GOOGLE_PRIVATE_KEY:-}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-rasip.eduport@gmail.com}
      HUB_URL: ${HUB_URL:-http://localhost:3000}
      LEARN_URL: ${LEARN_URL:-http://localhost:3001}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/admin/login/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  hub:
    build:
      context: ./frontend/hub
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
        VITE_HUB_URL: ${HUB_URL:-http://localhost:3000}
        VITE_LEARN_URL: ${LEARN_URL:-http://localhost:3001}
    container_name: eduplus-hub
    ports:
      - "${HUB_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

  learn:
    build:
      context: ./frontend/learn
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
        VITE_HUB_URL: ${HUB_URL:-http://localhost:3000}
        VITE_LEARN_URL: ${LEARN_URL:-http://localhost:3001}
    container_name: eduplus-learn
    ports:
      - "${LEARN_PORT:-3001}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
